<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>🏏 क्रिकेट जर्सी डिज़ाइनर 3D — Welcome</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: linear-gradient(180deg, #2196f3 0%, #60a5fa 50%, #e6f6ff 100%);
    font-family: "Poppins", sans-serif;
    color: #06325a;
  }
  h1 {
    margin: 22px 0 10px;
    color: #03396b;
    text-align: center;
  }
  .viewer-wrap {
    width: 360px;
    position: relative;
    border-radius: 14px;
    overflow: visible;
    margin: 6px 0 18px;
  }
  iframe {
    width: 100%;
    height: 400px;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(3,37,65,0.12);
    background: #111;
    border: 0;
  }
  .overlay-text {
    position: absolute;
    left: 50%;
    top: 46%;
    transform: translate(-50%, -50%);
    width: 70%;
    text-align: center;
    pointer-events: none;
    user-select: none;
  }
  .overlay-team {
    font-weight: 700;
    font-size: 16px;
    color: #ffffff;
    text-shadow: 0 2px 6px rgba(0,0,0,0.6);
  }
  .overlay-player {
    margin-top: 6px;
    font-weight: 700;
    font-size: 26px;
    color: #ffffff;
    text-shadow: 0 3px 8px rgba(0,0,0,0.65);
  }
  .form-box {
    width: 360px;
    background: #fff;
    border-radius: 12px;
    padding: 14px;
    box-shadow: 0 14px 30px rgba(3,37,65,0.06);
    margin-bottom: 30px;
  }
  .form-row { margin-bottom: 10px; }
  input, textarea, select {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #d0e6ff;
    background: #f7fbff;
    font-size: 15px;
  }
  button {
    width: 100%;
    margin-top: 8px;
    padding: 10px;
    border-radius: 8px;
    border: none;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
  }
  .btn-apply { background: linear-gradient(90deg,#0b65d3,#0066cc); color: white; }
  .btn-confirm { background: linear-gradient(90deg,#06b06a,#019e64); color: white; }
</style>
</head>
<body>

  <h1>🏏 Cricket Jersey Designer (3D)</h1>

  <div class="viewer-wrap">
    <iframe title="Cricket Jersey Model"
      allow="autoplay; fullscreen; xr-spatial-tracking"
      src="https://sketchfab.com/models/fb244c7664c84e9a88e8c31cc8e83fc7/embed">
    </iframe>

    <div class="overlay-text" id="overlay">
      <div class="overlay-team" id="overlayTeam">TEAM</div>
      <div class="overlay-player" id="overlayPlayer">PLAYER</div>
    </div>
  </div>

  <div class="form-box">
    <div class="form-row"><input id="nameInput" type="text" placeholder="नाम दर्ज करें"></div>
    <div class="form-row"><input id="phoneInput" type="text" placeholder="फोन नंबर"></div>
    <div class="form-row"><textarea id="addressInput" placeholder="पता (Auto Fill हो जाएगा)"></textarea></div>

    <div class="form-row"><input id="teamInput" type="text" placeholder="टीम का नाम (जैसे SKP)"></div>
    <div class="form-row"><input id="playerInput" type="text" placeholder="खिलाड़ी का नाम (जैसे ARIF)"></div>
    <div class="form-row"><input id="numberInput" type="number" placeholder="जर्सी नंबर"></div>
    <div class="form-row">
      <select id="sizeInput">
        <option value="M">Medium</option>
        <option value="L">Large</option>
        <option value="XL">XL</option>
        <option value="S">Small</option>
      </select>
    </div>

    <button id="applyBtn" class="btn-apply">🎨 Apply Design</button>
    <button id="confirmBtn" class="btn-confirm">✅ Confirm Order</button>
  </div>

<script>
  const overlayTeam = document.getElementById('overlayTeam');
  const overlayPlayer = document.getElementById('overlayPlayer');
  const teamInput = document.getElementById('teamInput');
  const playerInput = document.getElementById('playerInput');
  const nameInput = document.getElementById('nameInput');
  const phoneInput = document.getElementById('phoneInput');
  const addressInput = document.getElementById('addressInput');
  const numberInput = document.getElementById('numberInput');
  const sizeInput = document.getElementById('sizeInput');

  document.getElementById('applyBtn').addEventListener('click', () => {
    overlayTeam.textContent = (teamInput.value || 'TEAM').toUpperCase();
    overlayPlayer.textContent = (playerInput.value || 'PLAYER').toUpperCase();
    alert('🎨 Design Updated on 3D Jersey!');
  });

  // LIVE LOCATION FUNCTION 🛰️
  function getLiveLocation() {
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(success, error);
    } else {
      alert("❌ आपका ब्राउज़र GPS सपोर्ट नहीं करता।");
    }

    function success(position) {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;
      fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`)
        .then(res => res.json())
        .then(data => {
          if (data && data.display_name) {
            addressInput.value = data.display_name;
          } else {
            addressInput.value = `Lat: ${lat}, Lon: ${lon}`;
          }
        })
        .catch(() => addressInput.value = `Lat: ${lat}, Lon: ${lon}`);
    }

    function error(err) {
      alert("⚠️ Location Access Denied या Error आया।");
      console.log(err);
    }
  }

  // Load live location automatically
  getLiveLocation();

  // Confirm Order
  document.getElementById('confirmBtn').addEventListener('click', () => {
    const name = encodeURIComponent(nameInput.value);
    const phone = encodeURIComponent(phoneInput.value);
    const address = encodeURIComponent(addressInput.value);
    const team = encodeURIComponent(teamInput.value);
    const player = encodeURIComponent(playerInput.value);
    const number = encodeURIComponent(numberInput.value);
    const size = encodeURIComponent(sizeInput.value);
    const url = `payment.php?name=${name}&phone=${phone}&address=${address}&team=${team}&player=${player}&number=${number}&size=${size}`;
    window.location.href = url;
  });
</script>

</body>
</html>
